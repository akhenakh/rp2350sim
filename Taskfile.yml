      - '{{.TINYGO}} build -target={{.TARGET}} -scheduler=cores -o ../../{{.BUILD}}/assigncore.elf .'

  run:assigncore:
    desc: Run the machine.AssignCore affinity test
    deps: [build, firmware:assigncore]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/assigncore.elf -seconds 1.5'

  run:cores:
    desc: Run the multicore test and trace both cores' pins
    deps: [build, firmware:cores]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/cores.elf -seconds 1.5 -trace-pins 15,25'

  firmware:ws2812:
    desc: Build the WS2812B example (TinyGo PIO driver)
    dir: firmware/ws2812
    sources:
