version: 2

project_name: rp2350sim

# Both programs are pure Go: the UI uses Shirei/purego, so CGO is not needed
# and one runner can cross-compile every target.
builds:
  - id: cli
    main: ./cmd/rp2350sim
    binary: rp2350sim
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  # cmd/simui is its own module so GUI dependencies never enter the emulator.
  - id: ui
    dir: cmd/simui
    main: .
    binary: rp2350sim-ui
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: release
    ids:
      - cli
      - ui
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - docs/*

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^ci:"
      - "^build:"
      - "^test:"
      - "^chore:"
