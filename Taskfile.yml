version: '3'

vars:
  TINYGO: tinygo
  TARGET: pico2
  BUILD: build
  EMU: '{{.BUILD}}/rp2350sim'
  BLINKY: '{{.BUILD}}/blinky.elf'

tasks:
  default:
    desc: Build the emulator and the blinky firmware
    cmds:
      - task: build
      - task: firmware:blinky

  build:
    desc: Build the emulator
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - go.mod
    generates:
      - '{{.EMU}}'
    cmds:
      - go build -o {{.EMU}} ./cmd/rp2350sim

  install:
    desc: Install the rp2350sim binary into GOBIN
    cmds:
      - go install ./cmd/rp2350sim

  test:
    desc: Run the unit tests
    cmds:
      - go test ./...

  test:simui:
    desc: Run the desktop UI tests
    dir: cmd/simui
    cmds:
      - go test ./...

  test:js:
    desc: Run the browser plugin backend tests under Node's native WebAssembly engine
    cmds:
      - |
        if ! command -v node >/dev/null 2>&1; then
          echo "node not found: skipping the js/wasm plugin tests"
          exit 0
        fi
        # wasm_exec passes the whole environment to Node, which rejects large
        # environments, so run the test binary with the few variables Go needs.
        env -i PATH="$PATH" HOME="$HOME" \
          GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" \
          GOOS=js GOARCH=wasm \
          go test ./internal/deviceplugin/ -count=1 \
          -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec"

  test:race:
    desc: Run the unit tests with the Go race detector
    cmds:
      - go test -race ./...
      - cd cmd/simui && go test -race ./...

  lint:
    desc: Static gates (golangci-lint with modernize, go fix diff) for every module
    deps: [lint:root, lint:simui, lint:ch9120, lint:w6300]

  lint:root:
    cmds:
      - go vet ./...
      - golangci-lint run ./...
      - go fix -diff ./...

  lint:simui:
    dir: cmd/simui
    cmds:
      - go vet ./...
      - golangci-lint run ./...
      - go fix -diff ./...
      # The browser build is a supported target: keep it compiling.
      - GOOS=js GOARCH=wasm go build ./...

  lint:ch9120:
    dir: drivers/ch9120
    cmds:
      - go vet ./...
      - golangci-lint run ./...
      - go fix -diff ./...

  lint:w6300:
    dir: drivers/w6300
    cmds:
      - go vet ./...
      - golangci-lint run ./...
      - go fix -diff ./...

  ci:
    desc: Full verification (lint, unit tests, QEMU corpus, firmware smokes, UI snapshot)
    # The three groups are independent; Task runs dependencies in parallel.
    deps: [lint, ci:test, ci:smoke]

  ci:test:
    deps: [test, test:js, test:simui, test:qemu]

  ci:smoke:
    deps: [ci:smoke:builds]
    cmds:
      # Run the independent slices of tools/smoke.sh in parallel. One task
      # owns the shared build dependency, so the pico-examples tree is never
      # configured by two processes at once.
      - |
        pids=""
        for group in basic1 network basic2 c pex1 pex2 pex3 pex4; do
          (
            start=$(date +%s)
            PICO_C_BUILD=firmware/c/build PICO_EXAMPLES_READY=1 \
              SMOKE_GROUP=$group SMOKE_LOG="{{.BUILD}}/smoke-$group.log" \
              bash tools/smoke.sh "{{.BUILD}}"
            rc=$?
            echo "smoke[$group]: $(( $(date +%s) - start ))s" >&2
            exit $rc
          ) &
          pids="$pids $!"
        done
        status=0
        for pid in $pids; do
          wait "$pid" || status=1
        done
        exit $status

  ci:smoke:builds:
    deps:
      - build
      - firmware:blinky
      - firmware:audio
      - firmware:midi
      - firmware:hid
      - firmware:hidgamepad
      - firmware:debugvars
      - firmware:lcd
      - firmware:touchlcd
      - firmware:piotest
      - firmware:ws2812
      - firmware:cores
      - firmware:assigncore
      - firmware:echo
      - firmware:w6300
      - firmware:w5500
      - firmware:protocols
      - firmware:serialbridge
      - firmware:busmaster
      - firmware:busdevice
      - firmware:presets
      - firmware:pluginlcd
      - firmware:onewire
      - firmware:dht
      - firmware:ultrasonic
      - firmware:gps
      - firmware:can
      - firmware:lab
      - firmware:itm
      - c:build
      - firmware:ble
      - firmware:ch9120
      - firmware:wifi
      - firmware:sdcard
      - ci:picoexamples
      - ci:tools

  ci:picoexamples:
    desc: Warm the pinned pico-examples build after c:build
    deps: [c:build]
    cmds:
      - |
        if [ -n "${PICO_SDK_PATH:-}" ] && command -v arm-none-eabi-gcc >/dev/null 2>&1 &&
          command -v cmake >/dev/null 2>&1; then
          if ! bash tools/picoexamples.sh "{{.BUILD}}/pico-examples" >"{{.BUILD}}/picoexamples.log" 2>&1; then
            echo "pico-examples build failed:" >&2
            tail -30 "{{.BUILD}}/picoexamples.log" >&2
            exit 1
          fi
        fi

  ci:tools:
    desc: Build the host helpers used by the smoke suite
    cmds:
      - |
        mkdir -p "{{.BUILD}}"
        pids=""
        for tool in ethhost pngcheck pincheck wavcheck serialcheck busfake; do
          go build -o "{{.BUILD}}/$tool" "./tools/$tool" 2>"{{.BUILD}}/build-$tool.log" &
          pids="$pids $!"
        done
        status=0
        for pid in $pids; do
          wait "$pid" || status=1
        done
        if [ "$status" -ne 0 ]; then
          for tool in ethhost pngcheck pincheck wavcheck serialcheck busfake; do
            cat "{{.BUILD}}/build-$tool.log" >&2
          done
          exit 1
        fi

  zephyr:smoke:
    desc: Build and run Zephyr samples on the RP2350 (needs a west workspace and /opt/zephyr-sdk)
    deps: [build]
    cmds:
      - bash tools/zephyr-smoke.sh {{.BUILD}}

  test:qemu:
    desc: Differential instruction tests against QEMU (qemu-system-arm + arm-none-eabi-gdb)
    cmds:
      - go test -tags qemu ./internal/m33 -run 'TestQEMU'

  audio:test:
    desc: Run the PWM audio firmware and check the exported WAV
    deps: [build, firmware:audio]
    cmds:
      - go build -o {{.BUILD}}/wavcheck ./tools/wavcheck
      - '{{.EMU}} -fw {{.BUILD}}/audio.elf -seconds 1 -quiet -audio-pwm 0 -audio-out {{.BUILD}}/audio.wav'
      - '{{.BUILD}}/wavcheck -rate 48000 -channels 1 -freq 440 -freq-tol 30 -min-rms 0.1 {{.BUILD}}/audio.wav'

  run:audio:
    desc: Decode the PWM audio demo to a WAV and report its properties
    deps: [build, firmware:audio]
    cmds:
      - go build -o {{.BUILD}}/wavcheck ./tools/wavcheck
      - '{{.EMU}} -fw {{.BUILD}}/audio.elf -seconds 1 -audio-pwm 0 -audio-out {{.BUILD}}/audio-demo.wav'
      - '{{.BUILD}}/wavcheck {{.BUILD}}/audio-demo.wav'

  run:midi:
    desc: Run the USB-MIDI demo with the message monitor
    deps: [build, firmware:midi]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/midi.elf -seconds 1.2 -usb-midi -midi-monitor'

  run:midi:uart:
    desc: Run the UART-MIDI demo (31250 baud on UART1)
    deps: [build, firmware:midi]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/midi.elf -seconds 1.2 -midi-uart 1 -midi-monitor'

  run:hid:
    desc: Run the USB HID keyboard + mouse demo with the report monitor
    deps: [build, firmware:hid]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/hid.elf -seconds 3 -usb-hid'

  run:hidgamepad:
    desc: Run the USB HID gamepad demo with the report monitor
    deps: [build, firmware:hidgamepad]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/hidgamepad.elf -seconds 3 -usb-hid'

  firmware:blinky:
    desc: Build the TinyGo blinky firmware for the Pico 2
    dir: firmware/blinky
    sources:
      - main.go
      - go.mod
    generates:
      - '../../{{.BUILD}}/blinky.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BLINKY}} .'

  firmware:audio:
    desc: Build the TinyGo PWM/GPIO audio example
    dir: firmware/audio
    sources:
      - main.go
      - go.mod
    generates:
      - '../../{{.BUILD}}/audio.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/audio.elf .'

  firmware:midi:
