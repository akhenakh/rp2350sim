      - '{{.TINYGO}} build -target={{.TARGET}} -scheduler=cores -o ../../{{.BUILD}}/cores.elf .'

  firmware:assigncore:
    desc: Build the cores scheduler affinity test (-scheduler=cores)
    dir: firmware/assigncore
    sources:
