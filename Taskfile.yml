  wasm:build:
    desc: Build the desktop UI for the browser (Shirei/WASM) into build/web
    deps: [firmware:lcd, firmware:touchlcd]
    cmds:
      - mkdir -p {{.BUILD}}/web/firmware
      - cp {{.BUILD}}/lcd.elf {{.BUILD}}/web/firmware/lcd.elf
      - cp {{.BUILD}}/touchlcd.elf {{.BUILD}}/web/firmware/touchlcd.elf
      # Prebuilt from github.com/akhenakh/tinychess; its sources are not
      # vendored here, so the browser demo ships the packed ELF as an asset.
      - cp site/static/demo/firmware/tinychess.elf {{.BUILD}}/web/firmware/tinychess.elf
      - mkdir -p {{.BUILD}}/web/plugins/examples
      - cp plugins/examples/*.lua plugins/examples/*.wasm {{.BUILD}}/web/plugins/examples/
      - cd cmd/simui && go run go.hasen.dev/shirei/cmd/shirei_web -webcompiler=go -o ../../{{.BUILD}}/web .
      # Pace Shirei's rAF loop: the browser emulator and UI share one thread,
      # so a static tab must not rebuild its widget tree at display rate.
      - cp tools/webframe.js {{.BUILD}}/web/webframe.js
      - |
        python3 - <<'PY'
        import pathlib
        p = pathlib.Path("{{.BUILD}}/web/index.html")
        s = p.read_text()
        if "webframe.js" not in s:
            tag = '<script src="wasm_exec.js"></script>'
            s = s.replace(tag, '<script src="webframe.js"></script>\n  ' + tag, 1)
            p.write_text(s)
        PY
      # Optional: wasm-opt shrinks the module (~8%) and buys about 10% throughput.
      - |
        if command -v wasm-opt >/dev/null 2>&1; then
          wasm-opt -O3 --enable-bulk-memory --enable-sign-ext \
            --enable-nontrapping-float-to-int --enable-mutable-globals \
            {{.BUILD}}/web/main.wasm -o {{.BUILD}}/web/main.opt.wasm &&
            mv {{.BUILD}}/web/main.opt.wasm {{.BUILD}}/web/main.wasm
        else
          echo "wasm-opt not found: serving the unoptimized module"
        fi

  wasm:serve:
    desc: Build and serve the browser UI on http://127.0.0.1:8787
    deps: [wasm:build]
    cmds:
      - cd {{.BUILD}}/web && python3 -m http.server 8787 --bind 127.0.0.1

