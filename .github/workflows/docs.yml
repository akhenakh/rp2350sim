name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "cmd/**"
      - "internal/**"
      - "tools/gen_docs_site.py"
      - "Taskfile.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.170.1"
          extended: true

      # The Web demo is the desktop UI compiled to wasm; the page needs the
      # demo firmware, so the docs job builds the two TinyGo examples.
      - name: Install TinyGo
        run: |
          version=0.43.0
          curl -fsSL "https://github.com/tinygo-org/tinygo/releases/download/v${version}/tinygo${version}.linux-amd64.tar.gz" \
            | sudo tar -xz -C /opt
          echo "/opt/tinygo/bin" >> "$GITHUB_PATH"

      # wasm-opt shrinks the demo module (~9%) and buys ~10% throughput.
      - name: Install binaryen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binaryen

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: task docs:build
        env:
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url }}/

      - name: Build web demo
        run: task docs:demo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
