        clang --target=wasm32 -nostdlib -O2 -fno-builtin -Wall -Wextra
        -Wl,--no-entry -Wl,--strip-all
        -Wl,--export=plugin_abi_version -Wl,--export=plugin_alloc
        -Wl,--export=plugin_init -Wl,--export=plugin_reset
        -Wl,--export=plugin_tick -Wl,--export=i2c_begin
        -Wl,--export=i2c_write -Wl,--export=i2c_read -Wl,--export=i2c_end
        -Wl,--export=spi_select -Wl,--export=spi_transfer -Wl,--export=uart_tx
