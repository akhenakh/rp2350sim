version: '3'

vars:
  TINYGO: tinygo
  TARGET: pico2
  BUILD: build
  EMU: '{{.BUILD}}/rp2350sim'
  BLINKY: '{{.BUILD}}/blinky.elf'

tasks:
  default:
    desc: Build the emulator and the blinky firmware
    cmds:
      - task: build
      - task: firmware:blinky

  build:
    desc: Build the emulator
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - go.mod
    generates:
      - '{{.EMU}}'
    cmds:
      - go build -o {{.EMU}} ./cmd/rp2350sim

  install:
    desc: Install the rp2350sim binary into GOBIN
    cmds:
      - go install ./cmd/rp2350sim

  test:
    desc: Run the unit tests
    cmds:
      - go test ./...

  lint:
    desc: Static gates (golangci-lint with modernize, go fix diff) for every module
    cmds:
      - go vet ./...
      - golangci-lint run ./...
      - go fix -diff ./...
      - cd cmd/simui && go vet ./... && golangci-lint run ./... && go fix -diff ./...
      - cd drivers/ch9120 && go vet ./... && golangci-lint run ./... && go fix -diff ./...
      - cd drivers/w6300 && go vet ./... && golangci-lint run ./... && go fix -diff ./...

  ci:
    desc: Full verification (lint, unit tests, QEMU corpus, firmware smokes, UI snapshot)
    deps:
      - build
      - firmware:blinky
      - firmware:lcd
      - firmware:touchlcd
      - firmware:piotest
      - firmware:ws2812
      - firmware:cores
      - firmware:echo
      - firmware:w6300
      - firmware:w5500
      - firmware:protocols
      - firmware:serialbridge
      - firmware:busmaster
      - firmware:busdevice
      - firmware:ch9120
      - firmware:wifi
      - firmware:sdcard
    cmds:
      - task: lint
      - go test ./...
      - cd cmd/simui && go test ./...
      - 'go test -tags qemu ./internal/m33 -run TestQEMUInstructions'
      - 'go build -o {{.BUILD}}/ethhost ./tools/ethhost'
      - 'go build -o {{.BUILD}}/pngcheck ./tools/pngcheck'
      - 'go build -o {{.BUILD}}/pincheck ./tools/pincheck'
      - 'go build -o {{.BUILD}}/serialcheck ./tools/serialcheck'
      - 'go build -o {{.BUILD}}/busfake ./tools/busfake'
      - 'bash tools/smoke.sh {{.BUILD}}'

  test:qemu:
    desc: Differential instruction tests against QEMU (qemu-system-arm + arm-none-eabi-gdb)
    cmds:
      - go test -tags qemu ./internal/m33 -run TestQEMUInstructions

  firmware:blinky:
    desc: Build the TinyGo blinky firmware for the Pico 2
    dir: firmware/blinky
    sources:
      - main.go
      - go.mod
    generates:
      - '../../{{.BUILD}}/blinky.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BLINKY}} .'

  firmware:blinky:uf2:
    desc: Build the blinky firmware as a UF2 image for flashing a real board
    dir: firmware/blinky
    sources:
      - main.go
      - go.mod
    generates:
      - '../../{{.BUILD}}/blinky.uf2'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/blinky.uf2 .'

  firmware:lcd:
    desc: Build the TinyGo ST7789 example firmware
    dir: firmware/lcd
    sources:
      - main.go
      - go.mod
      - go.sum
    generates:
      - '../../{{.BUILD}}/lcd.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/lcd.elf .'

  firmware:sdcard:
    desc: Build the microSD / FAT16 GEEK example firmware
    dir: firmware/sdcard
    sources:
      - main.go
      - go.mod
      - go.sum
    generates:
      - '../../{{.BUILD}}/sdcard.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/sdcard.elf .'

  run:sdcard:
    desc: Read the microSD card and list its FAT16 root directory
    deps: [build, firmware:sdcard]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/sdcard.elf -sd -sd-dir {{.BUILD}}/sdcard-host -seconds 4'

  run:blinky:
    desc: Run the blinky firmware and trace GP25 for three virtual seconds
    deps: [build, firmware:blinky]
    cmds:
      - '{{.EMU}} -fw {{.BLINKY}} -seconds 3 -trace-pins 25'

  firmware:touchlcd:
    desc: Build the RP2350-Touch-LCD-2 example firmware
    dir: firmware/touchlcd
    sources:
      - main.go
      - go.mod
      - go.sum
    generates:
      - '../../{{.BUILD}}/touchlcd.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/touchlcd.elf .'

  firmware:piotest:
    desc: Build the PIO API conformance firmware
    dir: firmware/piotest
    sources:
      - main.go
      - go.mod
      - go.sum
    generates:
      - '../../{{.BUILD}}/piotest.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/piotest.elf .'

  run:piotest:
    desc: Run the PIO checks through the tinygo-org/pio API
    deps: [build, firmware:piotest]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/piotest.elf -seconds 0.3'

  firmware:echo:
    desc: Build the console echo firmware
    dir: firmware/echo
    sources:
      - main.go
      - go.mod
    generates:
      - '../../{{.BUILD}}/echo.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/echo.elf .'

  run:echo:
    desc: Echo injected console input through USB CDC
    deps: [build, firmware:echo]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/echo.elf -seconds 0.5 -input "$(printf "hello rp2350\r")"'

  firmware:uart:
    desc: Build the UART logic-analyzer demo
    dir: firmware/uart
    sources:
      - main.go
      - go.mod
    generates:
      - '../../{{.BUILD}}/uart.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/uart.elf .'

  firmware:ch9120:
    desc: Build the CH9120 UART-Ethernet example
    dir: firmware/ch9120
    sources:
      - main.go
      - go.mod
      - go.sum
    generates:
      - '../../{{.BUILD}}/ch9120.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/ch9120.elf .'

  run:ch9120:
    desc: Run the CH9120 example against the host TCP echo
    deps: [build, firmware:ch9120]
    cmds:
      - |
        go build -o {{.BUILD}}/ethhost ./tools/ethhost
        {{.BUILD}}/ethhost > {{.BUILD}}/ethhost-ch9120.log 2>&1 &
        HOST=$!
        trap 'kill $HOST 2>/dev/null' EXIT
        sleep 0.5
        {{.EMU}} -fw {{.BUILD}}/ch9120.elf -seconds 1.5 -ch9120
        kill $HOST 2>/dev/null || true

  firmware:wifi:
    desc: Build the virtual Wi-Fi netdev example
    dir: firmware/wifi
    sources:
      - main.go
      - go.mod
      - go.sum
    generates:
      - '../../{{.BUILD}}/wifi.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/wifi.elf .'

  run:wifi:
    desc: Run the virtual Wi-Fi example against the host TCP echo
    deps: [build, firmware:wifi]
    cmds:
      - |
        go build -o {{.BUILD}}/ethhost ./tools/ethhost
        {{.BUILD}}/ethhost > {{.BUILD}}/ethhost-wifi.log 2>&1 &
        HOST=$!
        trap 'kill $HOST 2>/dev/null' EXIT
        sleep 0.5
        {{.EMU}} -fw {{.BUILD}}/wifi.elf -seconds 3 -ch9120
        kill $HOST 2>/dev/null || true

  firmware:serialbridge:
    desc: Build the UART1 TCP echo demo
    dir: firmware/serialbridge
    sources:
      - main.go
      - go.mod
    generates:
      - '../../{{.BUILD}}/serialbridge.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/serialbridge.elf .'

  firmware:busmaster:
    desc: Build the I2C/SPI TCP bridge master demo
    dir: firmware/busmaster
    sources:
      - main.go
      - go.mod
    generates:
      - '../../{{.BUILD}}/busmaster.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/busmaster.elf .'

  firmware:busdevice:
    desc: Build the I2C/SPI TCP bridge device demo
    dir: firmware/busdevice
    sources:
      - main.go
      - go.mod
    generates:
      - '../../{{.BUILD}}/busdevice.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/busdevice.elf .'

  firmware:protocols:
    desc: Build the UART/I2C/SPI logic-analyzer demo
    dir: firmware/protocols
    sources:
      - main.go
      - go.mod
    generates:
      - '../../{{.BUILD}}/protocols.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/protocols.elf .'

  firmware:cores:
    desc: Build the multicore scheduler test (-scheduler=cores)
    dir: firmware/cores
    sources:
      - main.go
      - go.mod
    generates:
      - '../../{{.BUILD}}/cores.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -scheduler=cores -o ../../{{.BUILD}}/cores.elf .'

  run:cores:
    desc: Run the multicore test and trace both cores' pins
    deps: [build, firmware:cores]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/cores.elf -seconds 1.5 -trace-pins 15,25'

  firmware:ws2812:
    desc: Build the WS2812B example (TinyGo PIO driver)
    dir: firmware/ws2812
    sources:
      - main.go
      - go.mod
      - go.sum
    generates:
      - '../../{{.BUILD}}/ws2812.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/ws2812.elf .'

  run:ws2812:
    desc: Run the WS2812B example and decode the LED frames
    deps: [build, firmware:ws2812]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/ws2812.elf -seconds 1.7 -ws2812 0'

  firmware:w6300:
    desc: Build the W6300 Ethernet example (RP2350-POE-ETH wiring)
    dir: firmware/w6300
    sources:
      - main.go
      - go.mod
      - go.sum
    generates:
      - '../../{{.BUILD}}/w6300.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/w6300.elf .'

  run:w6300:
    desc: Run the W6300 example against a host TCP echo/UDP sink and TCP server
    deps: [build, firmware:w6300]
    cmds:
      - |
        go build -o {{.BUILD}}/ethhost ./tools/ethhost
        {{.BUILD}}/ethhost > {{.BUILD}}/ethhost.log 2>&1 &
        HOST=$!
        trap 'kill $HOST 2>/dev/null' EXIT
        sleep 0.5
        {{.EMU}} -fw {{.BUILD}}/w6300.elf -seconds 4 -w6300
        kill $HOST 2>/dev/null || true
        cat {{.BUILD}}/ethhost.log

  firmware:w5500:
    desc: Build the stock TinyGo W5500 Ethernet example (breadboard wiring)
    dir: firmware/w5500
    sources:
      - main.go
      - go.mod
      - go.sum
    generates:
      - '../../{{.BUILD}}/w5500.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/w5500.elf .'

  run:w5500:
    desc: Run the W5500 example against a host TCP echo/UDP sink and TCP server
    deps: [build, firmware:w5500]
    cmds:
      - |
        go build -o {{.BUILD}}/ethhost ./tools/ethhost
        {{.BUILD}}/ethhost > {{.BUILD}}/ethhost-w5500.log 2>&1 &
        HOST=$!
        trap 'kill $HOST 2>/dev/null' EXIT
        sleep 0.5
        {{.EMU}} -fw {{.BUILD}}/w5500.elf -seconds 4 -eth
        kill $HOST 2>/dev/null || true
        cat {{.BUILD}}/ethhost-w5500.log

  run:lcd:
    desc: Run the ST7789 example in the emulator (LCD attached, backlight traced)
    deps: [build, firmware:lcd]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/lcd.elf -seconds 3 -lcd -trace-pins 25'

  lcd:
    desc: Run the ST7789 example and export its framebuffer as a PNG
    deps: [build, firmware:lcd]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/lcd.elf -seconds 1 -lcd -lcd-png {{.BUILD}}/lcd.png'

  run:touchlcd:
    desc: Run the Touch-LCD-2 example with a deterministic touch
    deps: [build, firmware:touchlcd]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/touchlcd.elf -seconds 3 -touch-lcd2 -touch 120,200 -touch-at 1s -touch-hold 500ms'

  touchlcd:
    desc: Run the Touch-LCD-2 example and export its framebuffer
    deps: [build, firmware:touchlcd]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/touchlcd.elf -seconds 1 -touch-lcd2 -lcd-png {{.BUILD}}/touchlcd.png'

  ui:blinky:
    desc: Run the desktop UI with the blinky firmware loaded
    aliases: [ui]
    deps: [firmware:blinky]
    dir: cmd/simui
    cmds:
      - go run . --board pico2 '../../{{.BLINKY}}'

  ui:lcd:
    desc: Run the desktop UI with the ST7789 example loaded
    deps: [firmware:lcd]
    dir: cmd/simui
    cmds:
      - go run . --board geek '../../{{.BUILD}}/lcd.elf'

  ui:touchlcd:
    desc: Run the UI on the Touch-LCD-2 board
    deps: [firmware:touchlcd]
    dir: cmd/simui
    cmds:
      - go run . --board touch-lcd2 '../../{{.BUILD}}/touchlcd.elf'

  ui:ws2812:
    desc: Run the UI with the WS2812B example (strip decoded from GP0)
    deps: [firmware:ws2812]
    dir: cmd/simui
    cmds:
      - go run . --board pico2-ws2812 '../../{{.BUILD}}/ws2812.elf'

  ui:scope:
    desc: Run the UI oscilloscope demo (1 kHz sine on GP26)
    dir: cmd/simui
    cmds:
      - go run . --board pico2-analog --tab scope

  ui:logic:
    desc: Run the UI logic analyzer with the UART/I2C/SPI demo
    deps: [firmware:protocols]
    dir: cmd/simui
    cmds:
      - go run . --board pico2-analog --tab logic '../../{{.BUILD}}/protocols.elf'

  ui:wifi:
    desc: Run the UI on the Pico 2 W (virtual Wi-Fi) with the netdev example
    deps: [firmware:wifi]
    dir: cmd/simui
    cmds:
      - go run . --board pico2w '../../{{.BUILD}}/wifi.elf'

  ui:ch9120:
    desc: Run the UI on the RP2350-ETH (CH9120) board with the echo example
    deps: [firmware:ch9120]
    dir: cmd/simui
    cmds:
      - go run . --board rp2350-eth '../../{{.BUILD}}/ch9120.elf'

  ui:serial:
    desc: Run the UI with UART1 bridged to an automatic TCP port (see Console)
    deps: [firmware:serialbridge]
    dir: cmd/simui
    cmds:
      - go run . --board pico2-serial '../../{{.BUILD}}/serialbridge.elf'

  ui:bus:
    desc: Run the UI on the Bus Pirate board (connect the Bus terminal, queue responses, then Reset)
    deps: [firmware:busmaster]
    dir: cmd/simui
    cmds:
      - go run . --board pico2-bus --tab bus '../../{{.BUILD}}/busmaster.elf'

  ui:bus:png:
    desc: Render the Bus Pirate tab headlessly to build/ui-bus.png
    deps: [firmware:busmaster]
    dir: cmd/simui
    cmds:
      - go run . --board pico2-bus --tab bus --run 0.05 --png '../../{{.BUILD}}/ui-bus.png' '../../{{.BUILD}}/busmaster.elf'

  ui:w6300:
    desc: Run the UI with the W6300 example on the POE-ETH board
    deps: [firmware:w6300]
    dir: cmd/simui
    cmds:
      - go run . --board poe-eth '../../{{.BUILD}}/w6300.elf'

  ui:w5500:
    desc: Run the UI with the W5500 example on the breadboard board
    deps: [firmware:w5500]
    dir: cmd/simui
    cmds:
      - go run . --board pico2-w5500 '../../{{.BUILD}}/w5500.elf'

  ui:png:
    desc: Render the UI headlessly to build/ui.png with the LCD example
    deps: [firmware:lcd]
    dir: cmd/simui
    cmds:
      - go run . --board geek --tab lcd --png '../../{{.BUILD}}/ui.png' --run 0.6 '../../{{.BUILD}}/lcd.elf'

  ui:ota:
    desc: Run the UI with the OTA demo and a persistent flash image (self-update banner)
    deps: [build, c:build]
    dir: cmd/simui
    cmds:
      - rm -f '../../{{.BUILD}}/ui-ota-flash.bin'
      - go run . --board pico2 --flash '../../{{.BUILD}}/ui-ota-flash.bin' --run 0.5 '../../firmware/c/build/ota.elf'

  ui:ota-png:
    desc: Render the OTA self-update banner headlessly to build/ui-ota.png
    deps: [build, c:build]
    dir: cmd/simui
    cmds:
      - rm -f '../../{{.BUILD}}/ui-ota-flash.bin'
      - go run . --board pico2 --flash '../../{{.BUILD}}/ui-ota-flash.bin' --run 0.5 --width 1920 --height 1080 --png '../../{{.BUILD}}/ui-ota.png' '../../firmware/c/build/ota.elf'

  c:build:
    desc: Build the Pico SDK C examples (requires PICO_SDK_PATH)
    dir: firmware/c
    sources:
      - CMakeLists.txt
      - '*/main.c'
      - bin2c.py
    generates:
      - 'build/hello.elf'
      - 'build/blinky.elf'
      - 'build/floatdemo.elf'
      - 'build/multicore.elf'
      - 'build/otp.elf'
      - 'build/ota.elf'
      - 'build/ota2.elf'
    cmds:
      - test -n "$PICO_SDK_PATH" || (echo "PICO_SDK_PATH is not set" >&2; exit 1)
      - cmake -S . -B build -G Ninja -DPICO_BOARD=pico2 -DPICO_SDK_PATH="$PICO_SDK_PATH" -DCMAKE_BUILD_TYPE=Release
      - cmake --build build

  c:hello:
    desc: Run the Pico SDK hello world and assert its UART output
    deps: [build, c:build]
    cmds:
      - '{{.EMU}} -fw firmware/c/build/hello.elf -seconds 1 -quiet -expect "hello c done" -stop-on-expect'

  c:blinky:
    desc: Run the Pico SDK blinky and trace GP25
    deps: [build, c:build]
    cmds:
      - '{{.EMU}} -fw firmware/c/build/blinky.elf -seconds 1 -trace-pins 25'

  c:float:
    desc: Run the C single-precision FPU demo
    deps: [build, c:build]
    cmds:
      - '{{.EMU}} -fw firmware/c/build/floatdemo.elf -seconds 1 -quiet'

  c:multicore:
    desc: Run the C multicore (core 1 through the SIO FIFO) demo
    deps: [build, c:build]
    cmds:
      - '{{.EMU}} -fw firmware/c/build/multicore.elf -seconds 1 -quiet'

  c:otp:
    desc: Run the C OTP demo and dump the array it programmed
    deps: [build, c:build]
    cmds:
      - '{{.EMU}} -fw firmware/c/build/otp.elf -seconds 0.3 -quiet -expect "OTP demo: ok" -stop-on-expect -otp-dump {{.BUILD}}/otp.json'

  c:ota:
    desc: Run the single-slot OTA demo, then boot the updated image from flash
    deps: [build, c:build]
    cmds:
      - rm -f {{.BUILD}}/ota-flash.bin
      - '{{.EMU}} -fw firmware/c/build/ota.elf -flash {{.BUILD}}/ota-flash.bin -seconds 2 -expect "ota v2 running" -stop-on-expect'
      - '{{.EMU}} -flash {{.BUILD}}/ota-flash.bin -seconds 0.2 -quiet'

  release:check:
    desc: Validate the GoReleaser configuration
    cmds:
      - goreleaser check

  release:snapshot:
    desc: Build the release archives locally (all platforms, no publish)
    cmds:
      - goreleaser release --snapshot --clean --skip=publish,announce

  clean:
    desc: Remove build outputs
    cmds:
      - rm -rf {{.BUILD}}

  picoexamples:build:
    desc: Build the pinned pico-examples subset (requires PICO_SDK_PATH)
    cmds:
      - bash tools/picoexamples.sh {{.BUILD}}/pico-examples
