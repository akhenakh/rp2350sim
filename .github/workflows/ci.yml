name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      smoke: ${{ steps.verify.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install TinyGo
        run: |
          version=0.43.0
          curl -fsSL "https://github.com/tinygo-org/tinygo/releases/download/v${version}/tinygo${version}.linux-amd64.tar.gz" \
            | sudo tar -xz -C /opt
          echo "/opt/tinygo/bin" >> "$GITHUB_PATH"

      - name: Install ARM toolchain and Pico SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib
          git clone --depth 1 --branch 2.3.1 https://github.com/raspberrypi/pico-sdk.git "$HOME/pico-sdk"
          git -C "$HOME/pico-sdk" submodule update --init --depth 1
          echo "PICO_SDK_PATH=$HOME/pico-sdk" >> "$GITHUB_ENV"

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install QEMU and a multiarch GDB
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm gdb-multiarch
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v gdb-multiarch)" "$HOME/.local/bin/arm-none-eabi-gdb"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify
        id: verify
        run: |
          set -o pipefail
          task ci 2>&1 | tee ci.log

      - name: Upload CI log
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: ci.log
          if-no-files-found: ignore

  # The report job never runs PR code: it only reads the log artifact and
  # writes a comment. That keeps the write token out of the test job. Fork PRs
  # are skipped because GitHub downgrades the token for pull_request runs from
  # forks and the comment API would reject it; their check status still shows.
  report:
    needs: test
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download CI log
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-log
          path: .

      - name: Comment smoke checks
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          SMOKE_OUTCOME: ${{ needs.test.outputs.smoke }}
          TEST_RESULT: ${{ needs.test.result }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- rp2350sim-smoke-report -->';
            let log = '';
            try {
              log = fs.readFileSync('ci.log', 'utf8');
            } catch (err) {
              log = '';
            }
            const checks = [];
            for (const line of log.split('\n')) {
              const m = line.match(/^\s*(ok|FAIL):\s+(.*\S)\s*$/);
              if (m) checks.push({ ok: m[1] === 'ok', name: m[2] });
            }
            const failed = checks.filter((c) => !c.ok);
            const passed = checks.length - failed.length;
            const sha = context.payload.pull_request?.head?.sha || context.sha;
            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const outcome = process.env.SMOKE_OUTCOME || 'unknown';
            const testResult = process.env.TEST_RESULT || 'unknown';

            const cell = (s) => s.replace(/\|/g, '\\|');
            let body = `${marker}\n`;
            body += `## rp2350sim smoke checks\n\n`;
            body += `**${passed} passed, ${failed.length} failed** · CI job: \`${testResult}\` (\`${outcome}\`) · [workflow run](${runURL}) · \`${sha.slice(0, 7)}\`\n\n`;

            if (checks.length === 0) {
              body += `The smoke suite did not run: the lint, unit-test or build gate failed before it. See the [workflow log](${runURL}).\n`;
            } else {
              if (failed.length > 0) {
                body += `Failed checks:\n\n`;
                for (const c of failed) body += `- ❌ ${c.name}\n`;
                body += `\n`;
              } else {
                body += `All smoke checks passed.\n\n`;
              }
              body += `<details><summary>All checks (${checks.length})</summary>\n\n`;
              body += `| | check |\n|---|---|\n`;
              for (const c of checks.slice(0, 150)) {
                body += `| ${c.ok ? '✅' : '❌'} | ${cell(c.name)} |\n`;
              }
              body += `\n</details>\n`;
              if (checks.length > 150) {
                body += `\n_${checks.length - 150} more checks omitted._\n`;
              }
            }

            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find((c) => c.body && c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
