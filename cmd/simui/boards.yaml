# Board definitions for the rp2350sim desktop UI.
#
# The UI starts with this list. Selecting a board configures the emulated chip:
# each device below is attached to the given SPI bus (or GPIO), and the UI
# shows a dedicated tab for it. Boards without a device do not get that tab.
#
# Fields:
#   id, name, description        identity shown in the picker and toolbar
#   lcd:    { spi, cs, dc, rst, width, height }
#   ethernet: { kind: w5500|w6300, spi, cs }
#   ws2812: { pin }
#
# RP2350SIM_BOARDS=/path/to/file.yaml replaces this embedded list.

boards:
  - id: pico2
    name: Raspberry Pi Pico 2
    description: RP2350A · USB CDC console · on-board LED on GP25
    scope: [0, 1]
    logic:
      uart: { tx: 0, rx: 1, baud: 115200 }

  - id: pico2-lcd
    name: RP2350 + ST7789 LCD
    description: 240×135 ST7789 on SPI1 (CS GP9, DC GP8, RST GP12)
    scope: [0, 1]
    logic:
      uart: { tx: 0, rx: 1, baud: 115200 }
      spi: { bus: 1, sck: 10, mosi: 11, cs: 9 }
    lcd:
      spi: 1
      cs: 9
      dc: 8
      rst: 12
      width: 240
      height: 135

  - id: pico2-ws2812
    name: RP2350 + WS2812B strip
    description: WS2812B data line on GP0, decoded from the PIO wire protocol
    scope: [0, 1]
    ws2812:
      pin: 0

  - id: geek
    name: Waveshare RP2350-GEEK
    description: 240×135 ST7789 on SPI1, microSD and I2C header
    scope: [0, 1]
    logic:
      uart: { tx: 0, rx: 1, baud: 115200 }
      i2c: { sda: 28, scl: 29 }
      spi: { bus: 1, sck: 10, mosi: 11, cs: 9 }
    lcd:
      spi: 1
      cs: 9
      dc: 8
      rst: 12
      width: 240
      height: 135

  - id: poe-eth
    name: Waveshare RP2350-POE-ETH
    description: W6300 Ethernet on SPI0 (CS GP17) with PoE
    scope: [0, 1]
    logic:
      uart: { tx: 0, rx: 1, baud: 115200 }
    ethernet:
      kind: w6300
      spi: 0
      cs: 17

  - id: rp2350-eth
    name: Waveshare RP2350-ETH (CH9120)
    description: CH9120 UART-to-Ethernet on UART1 GP20/21 · CFG0 GP18 · RST GP19 · TCPCS GP17
    scope: [20, 21]
    logic:
      uart: { bus: 1, tx: 21, rx: 20, baud: 115200 }
    ethernet:
      kind: ch9120
      uart: 1
      cfg0: 18
      rst: 19
      tcpcs: 17

  - id: pico2-w5500
    name: RP2350 + W5500
    description: Breadboard W5500 Ethernet on SPI0 (CS GP17)
    scope: [0, 1]
    logic:
      uart: { tx: 0, rx: 1, baud: 115200 }
    ethernet:
      kind: w5500
      spi: 0
      cs: 17

  - id: pico2-serial
    name: RP2350 + TCP serial
    description: UART1 bridged to an automatic TCP port (shown in the Console tab)
    scope: [4, 5]
    serial:
      - uart: 1
    logic:
      uart: { bus: 1, tx: 4, rx: 5, baud: 115200 }

  - id: pico2w
    name: Raspberry Pi Pico 2 W (virtual Wi-Fi)
    description: Host-backed virtual Wi-Fi netdev · CYW43439 and Bluetooth are not emulated
    scope: [20, 21]
    wifi:
      uart: 1
      cfg0: 18
      rst: 19
      tcpcs: 17
    logic:
      uart: { bus: 1, tx: 21, rx: 20, baud: 115200 }

  - id: pico2-analog
    name: RP2350 + analog + protocols
    description: 1 kHz sine on GP26 plus UART/I2C/SPI demo pins for the analyzers
    scope: [26, 0, 1]
    analog:
      - pin: 26
        wave: sine
        hz: 1000
        amplitude: 1.65
        offset: 1.65
    logic:
      uart: { tx: 0, rx: 1, baud: 115200 }
      i2c: { sda: 4, scl: 5 }
      spi: { sck: 18, mosi: 19, miso: 16, cs: 17 }
