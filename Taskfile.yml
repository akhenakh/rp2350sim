    dir: firmware/ch9120
    sources:
      - main.go
      - go.mod
      - go.sum
      - '../../drivers/ch9120/*.go'
      - '../../drivers/ch9120/go.mod'
    generates:
      - '../../{{.BUILD}}/ch9120.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/ch9120.elf .'

  run:ch9120:
    desc: Run the CH9120 example against the host TCP echo
    deps: [build, firmware:ch9120]
    cmds:
      - |
        go build -o {{.BUILD}}/ethhost ./tools/ethhost
        {{.BUILD}}/ethhost > {{.BUILD}}/ethhost-ch9120.log 2>&1 &
        HOST=$!
        trap 'kill $HOST 2>/dev/null' EXIT
        sleep 0.5
        {{.EMU}} -fw {{.BUILD}}/ch9120.elf -seconds 1.5 -ch9120
        kill $HOST 2>/dev/null || true

  firmware:wifi:
    desc: Build the virtual Wi-Fi netdev example
    dir: firmware/wifi
    sources:
      - main.go
      - go.mod
      - go.sum
      - '../../drivers/ch9120/*.go'
      - '../../drivers/ch9120/go.mod'
    generates:
      - '../../{{.BUILD}}/wifi.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/wifi.elf .'

  run:wifi:
    desc: Run the virtual Wi-Fi example against the host TCP echo
    deps: [build, firmware:wifi]
    cmds:
      - |
        go build -o {{.BUILD}}/ethhost ./tools/ethhost
        {{.BUILD}}/ethhost > {{.BUILD}}/ethhost-wifi.log 2>&1 &
        HOST=$!
        trap 'kill $HOST 2>/dev/null' EXIT
        sleep 0.5
        {{.EMU}} -fw {{.BUILD}}/wifi.elf -seconds 3 -ch9120
        kill $HOST 2>/dev/null || true

