      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/w6300.elf .'

  run:w6300:
    desc: Run the W6300 example against a host TCP echo/UDP sink and TCP server
    deps: [build, firmware:w6300]
    cmds:
      - |
        go build -o {{.BUILD}}/ethhost ./tools/ethhost
        {{.BUILD}}/ethhost -udp-reply > {{.BUILD}}/ethhost.log 2>&1 &
        HOST=$!
        trap 'kill $HOST 2>/dev/null' EXIT
        sleep 0.5
        {{.EMU}} -fw {{.BUILD}}/w6300.elf -seconds 4 -w6300
        kill $HOST 2>/dev/null || true
        cat {{.BUILD}}/ethhost.log

