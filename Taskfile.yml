      - go.sum
    generates:
      - '../../{{.BUILD}}/ws2812.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/ws2812.elf .'

  run:ws2812:
    desc: Run the WS2812B example and decode the LED frames
    deps: [build, firmware:ws2812]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/ws2812.elf -seconds 1.7 -ws2812 0'

