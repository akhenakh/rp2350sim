    dir: firmware/lcd
    sources:
      - main.go
      - go.mod
      - go.sum
    generates:
      - '../../{{.BUILD}}/lcd.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/lcd.elf .'

  firmware:sdcard:
    desc: Build the microSD / FAT16 GEEK example firmware
    dir: firmware/sdcard
    sources:
      - main.go
      - go.mod
      - go.sum
    generates:
      - '../../{{.BUILD}}/sdcard.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/sdcard.elf .'

  run:sdcard:
    desc: Read the microSD card and list its FAT16 root directory
    deps: [build, firmware:sdcard]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/sdcard.elf -sd -sd-dir {{.BUILD}}/sdcard-host -seconds 4'

  firmware:debugvars:
    desc: Build the TinyGo debugger fixture with known variables
    dir: firmware/debugvars
    sources:
      - main.go
      - go.mod
    generates:
      - '../../{{.BUILD}}/debugvars.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/debugvars.elf .'

  run:blinky:
    desc: Run the blinky firmware and trace GP25 for three virtual seconds
    deps: [build, firmware:blinky]
    cmds:
      - '{{.EMU}} -fw {{.BLINKY}} -seconds 3 -trace-pins 25'

  run:presets:
    desc: Run the built-in bus preset demo (BME280, MPU6050, SSD1306, W25Q16)
    deps: [build, firmware:presets]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/presets.elf -seconds 2 -i2c-preset 0:bme280@0x76 -i2c-preset 0:mpu6050@0x68 -i2c-preset 0:ssd1306@0x3c -spi-preset 0:w25q16@17'

  run:dht:
    desc: Run the DHT22 example with a 45% / 23 C sensor on GP6
    deps: [build, firmware:dht]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/dht.elf -seconds 2 -dht 6:dht22:45:23'

  run:can:
    desc: Run the MCP2515 example with a 0x123 peer
    deps: [build, firmware:can]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/can.elf -seconds 2 -can 17:20:0x123'

  run:lab:
    desc: Run the LCD sensor lab with every timed device attached
    deps: [build, firmware:lab]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/lab.elf -seconds 4 -onewire 2:22.5 -dht 3:dht22:45:23 -ultrasonic 5:6:100 -gps 1 -can 13:14:0x123 -itm'

  run:itm:
    desc: Print a TinyGo ITM stimulus line
    deps: [build, firmware:itm]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/itm.elf -seconds 1 -quiet -itm'

  run:gps:
    desc: Run the NMEA GPS example on UART1
    deps: [build, firmware:gps]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/gps.elf -seconds 2 -gps 1'

  run:ultrasonic:
    desc: Run the HC-SR04 example with a 100 cm target
    deps: [build, firmware:ultrasonic]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/ultrasonic.elf -seconds 2 -ultrasonic 6:7:100'

  run:onewire:
    desc: Run the DS18B20 example with a 22.5 C sensor on GP6
    deps: [build, firmware:onewire]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/onewire.elf -seconds 2 -onewire 6:22.5'

  run:pluginlcd:
    desc: Run the Touch-LCD-2 plugin dashboard headlessly
    deps: [build, firmware:pluginlcd]
    cmds:
      - bash scripts/pluginlcd.sh

  firmware:touchlcd:
    desc: Build the RP2350-Touch-LCD-2 example firmware
    dir: firmware/touchlcd
    sources:
      - main.go
      - go.mod
      - go.sum
    generates:
