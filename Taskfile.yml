    dir: firmware/uart
    sources:
      - main.go
      - go.mod
    generates:
      - '../../{{.BUILD}}/uart.elf'
    cmds:
      - mkdir -p ../../{{.BUILD}}
      - '{{.TINYGO}} build -target={{.TARGET}} -o ../../{{.BUILD}}/uart.elf .'

  firmware:ch9120:
