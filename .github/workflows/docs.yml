name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "tools/gen_docs_site.py"
      - "Taskfile.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: site/go.mod
          cache: true

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.170.1"
          extended: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Generate documentation
        run: python3 tools/gen_docs_site.py

      - name: Build site
        env:
          HUGO_MODULE_PROXY: https://proxy.golang.org
        run: hugo --source site --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
