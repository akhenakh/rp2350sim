# Board definitions for the rp2350sim desktop UI.
#
# The UI starts with this list. Selecting a board configures the emulated chip:
# each device below is attached to the given SPI bus (or GPIO), and the UI
# shows a dedicated tab for it. Boards without a device do not get that tab.
#
# Fields:
#   id, name, description        identity shown in the picker and toolbar
#   lcd:    { spi, cs, dc, rst, width, height, rotation, backlight }
#   touch:  { bus, addr, int, rst, width, height, rotation }
#   imu:    { bus, addr, int }
#   battery: { pin, divider, volts }
#   sd:     { spi, cs, image | dir }
#   ethernet: { kind: w5500|w6300, spi, cs }
#   ws2812: { pin }
#   psram:  { size_mb, cs, latency }
#   inputs: [{ kind: button|switch|encoder|adc|bootsel, id, label,
#              pin | pin_a/pin_b, active_low, initial, volts, min, max, step }]
#   serial: [{ uart, listen }]
#   i2c_tcp: [{ bus, addrs: [0x50], listen | connect }]
#   spi_tcp: [{ bus, cs, listen | connect }]
#   onewire: [{ pin, type: ds18b20, temperature }]
#   dht: [{ pin, kind: dht11|dht22, humidity, temperature }]
#   ultrasonic: [{ trig, echo, distance_cm }]
#   gps: { uart, lat, lon, altitude, speed_mps, course, satellites, fix, rate_ms }
#   can: { bus, cs, int, peer_id, reply_id }
#   i2c_presets: [{ bus, preset, addr }]   addr 0 = preset default
#   spi_presets: [{ bus, cs, preset }]
#
# Built-in presets: bme280 (0x76/0x77), ssd1306 (0x3c/0x3d), mpu6050
# (0x68/0x69), w25q16 (SPI). Run `rp2350sim -list-presets` for the full list.
#
# RP2350SIM_BOARDS=/path/to/file.yaml replaces this embedded list.

boards:
  - id: pico2
    name: Raspberry Pi Pico 2
    description: RP2350A · USB CDC console · on-board LED on GP25
    scope: [0, 1]
    logic:
      uart: { tx: 0, rx: 1, baud: 115200 }

  - id: pico2-w-ble
    name: Pico 2 W · BLE
    description: RP2350A · virtual CYW43 BLE controller · HOST_WAKE GP24
    scope: [0, 1]
    logic:
      uart: { tx: 0, rx: 1, baud: 115200 }
    ble:
      addr: "C0:DE:12:34:56:78"
      host_wake: 24
      seed: 42

  - id: pico2-inputs
    name: RP2350 + user controls
    description: Pico 2 header with a pushbutton, slide switch, rotary encoder, ADC pot and BOOTSEL
    scope: [12, 13, 14, 15, 26]
    logic:
      uart: { tx: 0, rx: 1, baud: 115200 }
    inputs:
      - { kind: bootsel, id: bootsel, label: BOOTSEL }
      - { kind: button, id: btn1, label: BTN 1, pin: 15 }
      - { kind: switch, id: sw1, label: SW 1, pin: 14, initial: false }
      - { kind: encoder, id: enc1, label: ENC 1, pin_a: 12, pin_b: 13 }
      - { kind: adc, id: pot1, label: POT 1, pin: 26, volts: 1.65, step: 0.05 }

  - id: pico2-can
    name: RP2350 + MCP2515 CAN
    description: MCP2515 on SPI0 CS GP17 · INT GP20 · simulated peer 0x123 → 0x124
    scope: [17, 18, 19, 20]
    can:
      bus: 0
      cs: 17
      int: 20
      peer_id: 0x123
      reply_id: 0x124
    logic:
      uart: { tx: 0, rx: 1, baud: 115200 }
      spi: { bus: 0, sck: 18, mosi: 19, miso: 16, cs: 17 }

  - id: pico2-gps
    name: RP2350 + GPS
    description: NMEA GPS on UART1 · GP8 TX / GP9 RX · 1 Hz GGA/RMC
    scope: [8, 9]
    gps:
      uart: 1
      lat: 45.5017
      lon: -73.5673
      altitude: 82
      speed_mps: 0
      course: 270
      satellites: 9
    logic:
      uart: { bus: 1, tx: 8, rx: 9, baud: 115200 }

  - id: pico2-dht
    name: RP2350 + DHT22
    description: DHT22 temperature and humidity sensor on GP6 · single-wire timing
    scope: [6]
    dht:
      - { pin: 6, kind: dht22, humidity: 45, temperature: 23 }
    logic:
      uart: { tx: 0, rx: 1, baud: 115200 }

  - id: pico2-ultrasonic
    name: RP2350 + HC-SR04
    description: HC-SR04 ultrasonic sensor · trigger GP6, echo GP7
    scope: [6, 7]
    ultrasonic:
      - { trig: 6, echo: 7, distance_cm: 100 }
    logic:
      uart: { tx: 0, rx: 1, baud: 115200 }

  - id: pico2-onewire
    name: RP2350 + DS18B20
    description: DS18B20 temperature sensor on GP6 · 1-Wire bit-banged or PIO
    scope: [6]
    onewire:
      - { pin: 6, type: ds18b20, temperature: 22.5 }
    logic:
      uart: { tx: 0, rx: 1, baud: 115200 }

  - id: pico2-dvi
    name: RP2350 + HSTX DVI
    description: HSTX TMDS output on GP12-19 · DVI tab and PNG export
    hstx: true
    scope: [12, 13, 14, 15]

  - id: pico2b
    name: RP2350B (QFN-80)
    description: RP2350B · 48 GPIOs · any pin, PIO GPIOBASE 16 for GP32-47
    package: qfn80
    scope: [0, 16, 32, 47]

  - id: pico2-psram
    name: RP2350 + PSRAM
    description: RP2350A · 8 MB QSPI PSRAM on QMI CS1 (GP8) · slower than SRAM
    scope: [0, 1]
    psram:
      size_mb: 8
      cs: 8
      latency: 6
    logic:
      uart: { tx: 0, rx: 1, baud: 115200 }

  - id: pico2-bus
    name: RP2350 + remote I2C/SPI
    description: I2C0 at 0x50 and SPI0 CS GP17 exposed as Bus Pirate TCP devices
    scope: [0, 1]
    i2c_tcp:
      - bus: 0
        addrs: [0x50]
        listen: 127.0.0.1:0
    spi_tcp:
      - bus: 0
        cs: 17
        listen: 127.0.0.1:0

  - id: pico2-presets
    name: RP2350 + built-in bus devices
    description: BME280, SSD1306 and MPU6050 on I2C0 · W25Q16 flash on SPI0 CS GP17
    scope: [0, 1]
    i2c_presets:
      - { bus: 0, preset: bme280, addr: 0x76 }
      - { bus: 0, preset: ssd1306, addr: 0x3c }
      - { bus: 0, preset: mpu6050, addr: 0x68 }
    spi_presets:
      - { bus: 0, cs: 17, preset: w25q16 }

  - id: pico2-lcd
    name: RP2350 + ST7789 LCD
    description: 240×135 ST7789 on SPI1 (CS GP9, DC GP8, RST GP12)
    scope: [0, 1]
    logic:
      uart: { tx: 0, rx: 1, baud: 115200 }
      spi: { bus: 1, sck: 10, mosi: 11, cs: 9 }
    lcd:
      spi: 1
      cs: 9
      dc: 8
      rst: 12
      width: 240
      height: 135
      rotation: 90

  - id: pico2-ws2812
    name: RP2350 + WS2812B strip
    description: WS2812B data line on GP0, decoded from the PIO wire protocol
    scope: [0, 1]
    ws2812:
      pin: 0

  - id: geek
    name: Waveshare RP2350-GEEK
    description: 240×135 ST7789 on SPI1, microSD and I2C header
    scope: [0, 1]
    logic:
      uart: { tx: 0, rx: 1, baud: 115200 }
      i2c: { sda: 28, scl: 29 }
      spi: { bus: 1, sck: 10, mosi: 11, cs: 9 }
    lcd:
      spi: 1
      cs: 9
      dc: 8
      rst: 12
      width: 240
      height: 135
      rotation: 90
      backlight: 25
    sd:
      spi: 0
      cs: 23
      dir: sdcards/geek

  - id: touch-lcd2
    name: Waveshare RP2350-Touch-LCD-2
    description: 240×320 ST7789T3 touch LCD on SPI0 · CST816D + QMI8658 on I2C0 · microSD · battery ADC
    scope: [18, 19]
    logic:
      uart: { tx: 0, rx: 1, baud: 115200 }
      i2c: { sda: 12, scl: 13 }
      spi: { bus: 0, sck: 18, mosi: 19, miso: 4, cs: 17 }
    lcd:
      spi: 0
      cs: 17
      dc: 16
      rst: 20
      width: 320
      height: 240
      rotation: 90
      backlight: 15
    touch:
      bus: 0
      addr: 0x15
      int: 29
      rst: 20
      width: 240
      height: 320
      rotation: 90
    imu:
      bus: 0
      addr: 0x6b
      int: 14
    battery:
      pin: 28
      divider: 3
      volts: 3.9
    sd:
      spi: 1
      cs: 25
      dir: sdcards/touch-lcd2

  - id: pico2-lcd-lab
    name: RP2350-Touch-LCD-2 sensor lab
    description: ST7789 320x240 · DS18B20 GP2 · DHT22 GP3 · HC-SR04 GP5/6 · GPS UART1 GP8/9 · MCP2515 SPI0 CS GP13
    scope: [2, 3, 5, 6, 8, 9, 13]
    logic:
      uart: { bus: 1, tx: 8, rx: 9, baud: 115200 }
      spi: { bus: 0, sck: 18, mosi: 19, miso: 4, cs: 13 }
    lcd:
      spi: 0
      cs: 17
      dc: 16
      rst: 20
      width: 320
      height: 240
      rotation: 90
      backlight: 15
    onewire:
      - { pin: 2, type: ds18b20, temperature: 22.5 }
    dht:
      - { pin: 3, kind: dht22, humidity: 45, temperature: 23 }
    ultrasonic:
      - { trig: 5, echo: 6, distance_cm: 100 }
    gps:
      uart: 1
      lat: 45.5017
      lon: -73.5673
      altitude: 82
      speed_mps: 0
      course: 270
      satellites: 9
    can:
      bus: 0
      cs: 13
      int: 14
      peer_id: 0x123
      reply_id: 0x124

  - id: touch-lcd2-plugins
    name: RP2350-Touch-LCD-2 + mocked devices
    description: ST7789 LCD · Lua I2C env sensor at 0x76 · WASM UART air sensor on UART1
    scope: [18, 19]
    logic:
      uart: { bus: 1, tx: 8, rx: 9, baud: 115200 }
      i2c: { sda: 12, scl: 13 }
      spi: { bus: 0, sck: 18, mosi: 19, miso: 4, cs: 17 }
    lcd:
      spi: 0
      cs: 17
      dc: 16
      rst: 20
      width: 320
      height: 240
      rotation: 90
      backlight: 15
    touch:
      bus: 0
      addr: 0x15
      int: 29
      rst: 20
      width: 240
      height: 320
      rotation: 90
    imu:
      bus: 0
      addr: 0x6b
      int: 14
    battery:
      pin: 28
      divider: 3
      volts: 3.9
    i2c_plugins:
      - { bus: 0, addr: 0x76, file: ../../plugins/examples/env-sensor.lua, url: plugins/examples/env-sensor.lua }
    serial_plugins:
      - { uart: 1, file: ../../plugins/examples/aq-sensor.wasm, url: plugins/examples/aq-sensor.wasm }

  - id: poe-eth
    name: Waveshare RP2350-POE-ETH
    description: W6300 Ethernet on SPI0 (CS GP17) with PoE
    scope: [0, 1]
    logic:
      uart: { tx: 0, rx: 1, baud: 115200 }
    ethernet:
      kind: w6300
      spi: 0
      cs: 17

  - id: rp2350-eth
    name: Waveshare RP2350-ETH (CH9120)
    description: CH9120 UART-to-Ethernet on UART1 GP20/21 · CFG0 GP18 · RST GP19 · TCPCS GP17
    scope: [20, 21]
    logic:
      uart: { bus: 1, tx: 21, rx: 20, baud: 115200 }
    ethernet:
      kind: ch9120
      uart: 1
      cfg0: 18
      rst: 19
      tcpcs: 17

  - id: pico2-w5500
    name: RP2350 + W5500
    description: Breadboard W5500 Ethernet on SPI0 (CS GP17)
    scope: [0, 1]
    logic:
      uart: { tx: 0, rx: 1, baud: 115200 }
    ethernet:
      kind: w5500
      spi: 0
      cs: 17

  - id: pico2-serial
    name: RP2350 + TCP serial
    description: UART1 bridged to an automatic TCP port (shown in the Console tab)
    scope: [4, 5]
    serial:
      - uart: 1
    logic:
      uart: { bus: 1, tx: 4, rx: 5, baud: 115200 }

  - id: pico2w
    name: Raspberry Pi Pico 2 W (virtual Wi-Fi)
    description: Host-backed virtual Wi-Fi netdev over a CH9120 UART module
    scope: [20, 21]
    wifi:
      kind: ch9120
      uart: 1
      cfg0: 18
      rst: 19
      tcpcs: 17
    logic:
      uart: { bus: 1, tx: 21, rx: 20, baud: 115200 }

  - id: pico2w-cyw
    name: Raspberry Pi Pico 2 W (CYW43439 gSPI)
    description: On-board CYW43439 at the gSPI pins · firmware download, WLC init and WL_GPIO0 LED
    scope: [24, 25, 29]
    wifi:
      kind: cyw43439
      reg_on: 23
      data: 24
      cs: 25
      clk: 29
      mac: 02:11:22:33:44:55
      ssid: rp2350sim
      password: password

  - id: pico2-analog
    name: RP2350 + analog + protocols
    description: 1 kHz sine on GP26 plus UART/I2C/SPI demo pins for the analyzers
    scope: [26, 0, 1]
    analog:
      - pin: 26
        wave: sine
        hz: 1000
        amplitude: 1.65
        offset: 1.65
    logic:
      uart: { tx: 0, rx: 1, baud: 115200 }
      i2c: { sda: 4, scl: 5 }
      spi: { sck: 18, mosi: 19, miso: 16, cs: 17 }

  - id: pico2-adc
    name: RP2350 + ADC DSP sources
    description: Four generated ADC inputs on GP26-29 (sine, ramp, noise, square)
    scope: [26, 27, 28, 29]
    analog:
      - { pin: 26, wave: sine, hz: 1000, amplitude: 1.65, offset: 1.65 }
      - { pin: 27, wave: ramp, hz: 200, amplitude: 1.65, offset: 1.65 }
      - { pin: 28, wave: noise, amplitude: 1.0, offset: 1.65 }
      - { pin: 29, wave: square, hz: 500, amplitude: 1.65, offset: 1.65 }

  - id: pico2-plugins
    name: RP2350 + scripted devices
    description: Lua BME280/MPU6050/SSD1306 on I2C0, Lua/WASM SPI flash, UART modem
    scope: [0, 1]
    i2c_plugins:
      - { bus: 0, addr: 0x76, file: ../../plugins/examples/bme280.lua, url: plugins/examples/bme280.lua }
      - { bus: 0, addr: 0x68, file: ../../plugins/examples/mpu6050.lua, url: plugins/examples/mpu6050.lua }
      - { bus: 0, addr: 0x3c, file: ../../plugins/examples/ssd1306.lua, url: plugins/examples/ssd1306.lua }
    spi_plugins:
      - { bus: 0, cs: 17, file: ../../plugins/examples/w25q16.lua, url: plugins/examples/w25q16.lua }
      - { bus: 0, cs: 21, file: ../../plugins/examples/spi-flash.wasm, url: plugins/examples/spi-flash.wasm }
    serial_plugins:
      - { uart: 1, file: ../../plugins/examples/uart-modem.lua, url: plugins/examples/uart-modem.lua }
    logic:
      uart: { bus: 1, tx: 4, rx: 5, baud: 115200 }

  - id: pico2-audio
    name: RP2350 + PWM audio
    description: PWM/GPIO audio on GP0 · Audio tab and WAV export
    scope: [0]
    audio:
      kind: pwm
      pin: 0
      rate: 48000

  - id: pico2-midi
    name: RP2350 + USB-MIDI
    description: USB-MIDI device · MIDI tab monitor and virtual keyboard
    midi:
      kind: usb

  - id: pico2-midi-uart
    name: RP2350 + UART MIDI
    description: 31250-baud MIDI on UART1 (GP4 TX / GP5 RX)
    scope: [4, 5]
    midi:
      kind: uart
      uart: 1
    logic:
      uart: { bus: 1, tx: 4, rx: 5, baud: 31250 }
