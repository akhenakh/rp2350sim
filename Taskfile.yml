      - 'build/dcp.elf'
      - 'build/multicore.elf'
      - 'build/otp.elf'
      - 'build/psram.elf'
      - 'build/debug.elf'
      - 'build/hang.elf'
      - 'build/ota.elf'
      - 'build/ota2.elf'
      - 'build/usbhello.elf'
      - 'build/usbecho.elf'
      - 'build/aontimer.elf'
      - 'build/rtosctx.elf'
      - 'build/inputs.elf'
      - 'build/itmdemo.elf'
    cmds:
      - test -n "$PICO_SDK_PATH" || (echo "PICO_SDK_PATH is not set" >&2; exit 1)
      - cmake -S . -B build -G Ninja -DPICO_BOARD=pico2 -DPICO_SDK_PATH="$PICO_SDK_PATH" -DCMAKE_BUILD_TYPE=Release
      - cmake --build build

  c:itm:
    desc: Run the ITM stimulus demo and print the trace stream
    deps: [build, c:build]
    cmds:
      - '{{.EMU}} -fw firmware/c/build/itmdemo.elf -seconds 1 -quiet -itm'

  c:hello:
    desc: Run the Pico SDK hello world and assert its UART output
    deps: [build, c:build]
    cmds:
      - '{{.EMU}} -fw firmware/c/build/hello.elf -seconds 1 -quiet -expect "hello c done" -stop-on-expect'

  c:rtosctx:
    desc: Run the C preemptive context-switch demo (SVC, SysTick, PendSV, BASEPRI)
    deps: [build, c:build]
    cmds:
      - '{{.EMU}} -fw firmware/c/build/rtosctx.elf -seconds 2 -quiet -expect "rtosctx ok a=5 b=5 nested=1 crit=1" -stop-on-expect'

  c:hang:
    desc: Run the deliberate PLL_USB poll loop and assert the hang detector
    deps: [build, c:build]
    cmds:
      - '{{.EMU}} -fw firmware/c/build/hang.elf -seconds 1 -hang-cycles 500000 2>&1 | grep -q "hang detected"'

  run:hang:
    desc: Run the hang-detector fixture and print the explanation
    deps: [build, c:build]
    cmds:
      - '{{.EMU}} -fw firmware/c/build/hang.elf -seconds 1 -hang-cycles 500000'

  ui:hang:
    desc: Open the UI on the deliberate PLL hang and show the HANG explanation
    deps: [build, c:build]
    dir: cmd/simui
    cmds:
      - go run . --board pico2 '../../firmware/c/build/hang.elf'

  ui:hang:png:
    desc: Render the HANG banner for the PLL_SYS poll loop to build/ui-hang.png
    deps: [build, c:build]
    dir: cmd/simui
    cmds:
      - go run . --board pico2 --run 0.4 --png '../../{{.BUILD}}/ui-hang.png' '../../firmware/c/build/hang.elf'

  ui:profile:
    desc: Profile blinky in the new Profile tab (samples, exact coverage, IRQ latency, stack watermarks)
    deps: [firmware:blinky]
    dir: cmd/simui
    cmds:
      - go run . --board pico2 --tab profile '../../{{.BUILD}}/blinky.elf'

  ui:profile:png:
    desc: Render the Profile tab for blinky to build/ui-profile.png
    deps: [firmware:blinky]
    dir: cmd/simui
    cmds:
      - go run . --board pico2 --tab profile --run 0.5 --png '../../{{.BUILD}}/ui-profile.png' '../../{{.BUILD}}/blinky.elf'

  run:profile:
    desc: Run blinky headlessly and emit an LCOV report plus the hottest functions
    deps: [build, firmware:blinky]
    cmds:
      - '{{.EMU}} -fw {{.BUILD}}/blinky.elf -seconds 1 -profile -coverage {{.BUILD}}/blinky.info -profile-out {{.BUILD}}/blinky-profile.json -profile-top 10'

  c:inputs:
    desc: Run the board-controls firmware with the default (released) inputs
    deps: [build, c:build]
    cmds:
      - '{{.EMU}} -fw firmware/c/build/inputs.elf -seconds 1 -quiet -expect "inputs: btn=0 sw=0 enc=0 boot=0" -expect "0.00 V" -stop-on-expect'

  c:usbhello:
    desc: Run the Pico SDK USB CDC stdio hello world (TinyUSB)
    deps: [build, c:build]
    cmds:
      - '{{.EMU}} -fw firmware/c/build/usbhello.elf -seconds 1 -quiet -expect "hello usb done" -stop-on-expect'

  c:usbecho:
    desc: Run the Pico SDK USB CDC echo and feed it console input
    deps: [build, c:build]
    cmds:
      - '{{.EMU}} -fw firmware/c/build/usbecho.elf -seconds 1 -quiet -input "Z" -input-at 300ms -expect "echo Z" -stop-on-expect'

  c:aontimer:
    desc: Run the Pico SDK AON timer demo and wait for its alarm
    deps: [build, c:build]
    cmds:
      - '{{.EMU}} -fw firmware/c/build/aontimer.elf -seconds 2 -quiet -expect "aon alarm 1001" -stop-on-expect'

  c:blinky:
    desc: Run the Pico SDK blinky and trace GP25
    deps: [build, c:build]
    cmds:
      - '{{.EMU}} -fw firmware/c/build/blinky.elf -seconds 1 -trace-pins 25'

  c:float:
    desc: Run the C single-precision FPU demo
    deps: [build, c:build]
    cmds:
      - '{{.EMU}} -fw firmware/c/build/floatdemo.elf -seconds 1 -quiet'

  c:dcp:
    desc: Run the C double-precision DCP demo (arithmetic and sqrt)
    deps: [build, c:build]
    cmds:
      - '{{.EMU}} -fw firmware/c/build/dcp.elf -seconds 1 -quiet -expect "dcp ok" -stop-on-expect'

  c:multicore:
    desc: Run the C multicore (core 1 through the SIO FIFO) demo
    deps: [build, c:build]
    cmds:
      - '{{.EMU}} -fw firmware/c/build/multicore.elf -seconds 1 -quiet'

  c:otp:
    desc: Run the C OTP demo and dump the array it programmed
    deps: [build, c:build]
    cmds:
      - '{{.EMU}} -fw firmware/c/build/otp.elf -seconds 0.3 -quiet -expect "OTP demo: ok" -stop-on-expect -otp-dump {{.BUILD}}/otp.json'

  c:psram:
    desc: Run the C PSRAM demo with an 8 MiB PSRAM on QMI CS1
    deps: [build, c:build]
    cmds:
      - '{{.EMU}} -fw firmware/c/build/psram.elf -seconds 2 -quiet -psram 8 -psram-cs 8 -psram-latency 6 -expect "psram: ok" -stop-on-expect'

  c:debug:
    desc: Run the C debugger fixture and stop at debug_marker
    deps: [build, c:build]
    cmds:
      - '{{.EMU}} -fw firmware/c/build/debug.elf -seconds 1 -bp debug_marker -log-format text'

  debug:test:
    desc: Run debugger unit tests with the TinyGo and C fixtures
    deps: [build, firmware:debugvars, c:build]
    cmds:
      - go test ./internal/debug -v


  c:ota:
    desc: Run the single-slot OTA demo, then boot the updated image from flash
    deps: [build, c:build]
    cmds:
      - rm -f {{.BUILD}}/ota-flash.bin
      - '{{.EMU}} -fw firmware/c/build/ota.elf -flash {{.BUILD}}/ota-flash.bin -seconds 2 -expect "ota v2 running" -stop-on-expect'
      - '{{.EMU}} -flash {{.BUILD}}/ota-flash.bin -seconds 0.2 -quiet'

  release:check:
    desc: Validate the GoReleaser configuration
    cmds:
      - goreleaser check

  release:snapshot:
    desc: Build the release archives locally (all platforms, no publish)
    cmds:
      - goreleaser release --snapshot --clean --skip=publish,announce

  docs:demo:
    desc: Add the WebAssembly demo to the built site (run after docs:build)
    deps: [wasm:build]
    cmds:
      - rm -rf site/public/demo
      - cp -r {{.BUILD}}/web site/public/demo

  docs:theme:
    desc: Fetch the pinned Geekdoc theme release
    cmds:
      - mkdir -p site/themes/hugo-geekdoc
      - test -f site/themes/hugo-geekdoc/theme.toml || (curl -fsSL https://github.com/thegeeklab/hugo-geekdoc/releases/download/v5.0.0/hugo-geekdoc.tar.gz | tar -xz -C site/themes/hugo-geekdoc --strip-components=1)

  docs:images:
    desc: Regenerate every guide screenshot (Board, inputs, LCD, sensors, tabs, DVI, MIDI, audio, scope, profile, HID, plugins, logic, OTA)
    deps:
      - firmware:audio
      - firmware:midi
      - firmware:protocols
      - firmware:blinky
      - firmware:lcd
      - firmware:touchlcd
      - firmware:ws2812
      - firmware:wifi
      - firmware:ch9120
      - firmware:busmaster
      - firmware:presets
      - c:build
      - picoexamples:build
    cmds:
      - bash tools/render_docs_images.sh {{.BUILD}}

  docs:site:
    desc: Generate the Hugo content tree from docs/
    cmds:
      - python3 tools/gen_docs_site.py

  docs:serve:
    desc: Preview the Geekdoc documentation locally at http://localhost:1313
    deps: [docs:theme, docs:site]
    dir: site
    cmds:
      - hugo server --buildDrafts --disableFastRender --bind 127.0.0.1 --port 1313 --baseURL http://localhost:1313/

  docs:build:
    desc: Build the Geekdoc documentation site into site/public
    deps: [docs:theme, docs:site]
    dir: site
    cmds:
      - 'hugo --cleanDestinationDir --baseURL "${HUGO_BASEURL:-https://akhenakh.github.io/rp2350sim/}"'

  clean:
    desc: Remove build outputs
    cmds:
      - rm -rf {{.BUILD}}

  picoexamples:build:
    desc: Build the pinned pico-examples subset (requires PICO_SDK_PATH)
    cmds:
      - bash tools/picoexamples.sh {{.BUILD}}/pico-examples
